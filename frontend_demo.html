<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Image Generator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{
background:#0f172a;
color:#fff;
display:flex;
flex-direction:column;
height:100vh;
}

header{
padding:14px;
text-align:center;
font-weight:600;
background:#111827;
border-bottom:1px solid #1f2937;
}

#gallery{
flex:1;
overflow-y:auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:16px;
}

.card{
background:#111827;
border-radius:10px;
overflow:hidden;
border:1px solid #1f2937;
}

.card img{
width:100%;
display:block;
}

.card p{
font-size:13px;
padding:8px;
opacity:.8;
}

.card a{
display:block;
padding:6px 10px;
font-size:12px;
text-align:center;
background:#1f2937;
color:#fff;
text-decoration:none;
}

#controls{
padding:12px;
background:#111827;
border-top:1px solid #1f2937;
display:flex;
flex-wrap:wrap;
gap:8px;
}

input,button{
padding:10px;
border:none;
border-radius:6px;
}

#prompt{
flex:1;
min-width:160px;
}

#apikey{
width:140px;
}

button{
background:#6366f1;
color:white;
cursor:pointer;
}

button:hover{
background:#4f46e5;
}

.loader{
grid-column:1/-1;
text-align:center;
opacity:.7;
}
</style>

</head>

<body>

<header>✨ Free AI Image Generator</header>

<div id="gallery"></div>

<div id="controls">
<input id="apikey" type="password" placeholder="API Key">
<input id="prompt" placeholder="Describe the image you want...">
<button id="generateBtn">Generate</button>
</div>

<script>

// 👉 Replace with your deployed Worker URL, e.g. "https://my-worker.my-name.workers.dev"
const API_URL = "YOUR_WORKER_URL";

// Keep memory bounded: only this many images are kept in the gallery.
const MAX_CARDS = 24;

const gallery = document.getElementById("gallery");
const promptInput = document.getElementById("prompt");
const keyInput = document.getElementById("apikey");
const generateBtn = document.getElementById("generateBtn");

async function generate() {
    const prompt = promptInput.value.trim();
    const key = keyInput.value.trim();

    if (API_URL === "YOUR_WORKER_URL") {
        return alert("Set API_URL in this file to your Worker URL first.");
    }
    if (!prompt || !key) return alert("Enter prompt and API key");

    generateBtn.disabled = true;

    const loader = document.createElement("div");
    loader.className = "loader";
    loader.textContent = "Generating image...";
    gallery.prepend(loader);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + key,
            },
            body: JSON.stringify({ prompt }),
        });

        if (!res.ok) {
            // Try to read the error message the Worker returned.
            let message = "API Error (" + res.status + ")";
            try {
                const data = await res.json();
                if (data && data.error) message = data.error;
            } catch { /* body was not JSON */ }
            throw new Error(message);
        }

        const blob = await res.blob();
        addCard(blob, prompt);
        promptInput.value = "";
    } catch (err) {
        alert(err.message);
    } finally {
        loader.remove();
        generateBtn.disabled = false;
    }
}

function addCard(blob, prompt) {
    const objUrl = URL.createObjectURL(blob);

    const card = document.createElement("div");
    card.className = "card";
    card._objUrl = objUrl; // remembered so we can free it later

    const img = document.createElement("img");
    img.src = objUrl;
    img.alt = prompt;

    const caption = document.createElement("p");
    caption.textContent = prompt; // textContent avoids HTML injection

    const link = document.createElement("a");
    link.textContent = "Download";
    link.href = objUrl;
    link.download = "ai-image.png";

    card.append(img, caption, link);
    gallery.prepend(card);

    // Drop old cards and release their object URLs to avoid memory leaks.
    let cards = gallery.querySelectorAll(".card");
    while (cards.length > MAX_CARDS) {
        const oldest = cards[cards.length - 1];
        if (oldest._objUrl) URL.revokeObjectURL(oldest._objUrl);
        oldest.remove();
        cards = gallery.querySelectorAll(".card");
    }
}

generateBtn.addEventListener("click", generate);
promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generate();
});

</script>

</body>
</html>
